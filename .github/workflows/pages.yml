# V10-B4 · construye la web estática (src/v10/web.py) y la publica en GitHub Pages.
# V14.2 · en el repositorio público (vivienda-espana-evidencia) data/ no se versiona: antes de construir, `src/v14/datos.py`
# trae el paquete del depósito de Zenodo (URL de proyecto.json, zenodo_url_paquete) y verifica cada sha256. Mientras la URL
# sea «PENDIENTE», el paso falla con un mensaje claro y no se publica nada (docs/v14/publicacion_1_0/github_pages.md).
# Requisito del autor: Settings → Pages → Source: «GitHub Actions».
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-web.txt
      - name: Paquete del depósito en caché (se renueva si cambia proyecto.json)
        uses: actions/cache@v4
        with:
          path: _descarga
          key: deposito-${{ hashFiles('proyecto.json') }}
      - name: Datos del depósito (solo si data/ no está en el repositorio)
        run: |
          if [ ! -f data/base/publica/hechos.parquet ]; then python src/v14/datos.py; fi
      - run: python src/v10/monitor.py --sin-red
      - run: python src/v10/web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
