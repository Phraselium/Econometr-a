# V10-B4: construye la web estática (src/v10/web.py) y la publica en GitHub Pages.
# Requisito del autor: Settings → Pages → Source: «GitHub Actions» (docs/v10/tareas_autor.md).
name: web

on:
  push:
    branches: [main]
    paths: ["data/base/**", "output/v10/**", "figuras/**", "web/**", "src/v10/web.py", "publicacion/**", "CHANGELOG.md", "ERRATA.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-web.txt
      - run: python src/v10/monitor.py --sin-red
      - run: python src/v10/web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
